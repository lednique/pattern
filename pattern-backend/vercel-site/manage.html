<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patternique — управление</title><style>:root{--a:#DEDD74;--bg:#050708;--card:#121516;--text:#f3f6f7;--muted:#879399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 28px));margin:35px auto}h1{font-size:25px}.bar,.panel{display:flex;gap:8px;padding:13px;border:1px solid #252b2d;border-radius:20px;background:var(--card);margin-bottom:12px}.panel{align-items:end;flex-wrap:wrap}input,select,button{height:38px;border:1px solid #2a3134;border-radius:999px;background:#090b0c;color:#fff;padding:0 14px}input{flex:1;min-width:160px}button{border:0;background:var(--a);font-weight:700;cursor:pointer}.ghost{background:#252b2d}.danger{background:#712e35}.field{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:10px}.field input,.field select{min-width:150px}.table{overflow:auto;border:1px solid #252b2d;border-radius:20px}table{width:100%;border-collapse:collapse;min-width:780px;background:var(--card)}th,td{padding:11px;border-bottom:1px solid #252b2d;text-align:left}th{color:var(--muted);font-size:10px;text-transform:uppercase}.key{font-family:ui-monospace,monospace;color:#8ee2f5}.status{min-height:20px;color:#ff7680}</style></head><body><main class="wrap"><h1>Patternique · управление лицензиями</h1><div class="bar"><input id="password" type="password" placeholder="Пароль администратора"><button id="load">Войти / обновить</button><a href="/" style="margin:auto 12px;color:#DEDD74">На сайт</a></div><div class="panel"><div class="field">Тариф<select id="plan"><option value="annual">1 год</option><option value="lifetime">Бессрочно</option></select></div><div class="field">Email<input id="email" type="email" placeholder="необязательно"></div><div class="field">Срок вручную, дней<input id="days" type="number" min="1" max="3650" placeholder="по тарифу"></div><button id="create">Создать ключ</button></div><div class="status" id="status"></div><div class="table"><table><thead><tr><th>Ключ</th><th>Тариф</th><th>Статус</th><th>Email</th><th>Figma</th><th>Истекает</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
(function(){var pass='';function api(method,body){return fetch('/api/admin-keys',{method:method,headers:{'Content-Type':'application/json','X-Admin-Pass':pass},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||r.status);return d;});});}function esc(v){return String(v||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function load(){pass=document.getElementById('password').value;api('GET').then(function(d){document.getElementById('rows').innerHTML=d.keys.map(function(k){return'<tr><td class="key">'+esc(k.key)+'</td><td>'+ (k.plan==='annual'?'1 год':'Бессрочно')+'</td><td>'+esc(k.status)+'</td><td>'+esc(k.email)+'</td><td>'+esc(k.figma_user_id)+'</td><td>'+esc(k.expires_at?new Date(k.expires_at).toLocaleDateString('ru-RU'):'—')+'</td><td><button class="ghost reset" data-key="'+esc(k.key)+'">Сброс</button> <button class="danger del" data-key="'+esc(k.key)+'">Удалить</button></td></tr>';}).join('');}).catch(show);}function show(e){document.getElementById('status').textContent=e.message||e;}document.getElementById('load').onclick=load;document.getElementById('create').onclick=function(){api('POST',{plan:document.getElementById('plan').value,email:document.getElementById('email').value||undefined,days:document.getElementById('days').value||undefined}).then(load).catch(show);};document.getElementById('rows').onclick=function(e){var key=e.target.dataset.key;if(!key)return;if(e.target.classList.contains('del')&&confirm('Удалить '+key+'?'))api('DELETE',{key:key}).then(load).catch(show);if(e.target.classList.contains('reset'))api('PATCH',{key:key,reset_activation:true}).then(load).catch(show);};})();
</script></body></html>
