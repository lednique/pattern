<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050708"><title>Patternique — ключ готов</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--accent:#11A5CA;--bg:#050708;--card:#111415;--text:#f4f7f8;--muted:#89959b;--ok:#37d98a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(17,165,202,.4),transparent 45%),var(--bg);color:var(--text);font:14px/1.5 Montserrat,system-ui,sans-serif}.card{width:min(540px,100%);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:38px;background:rgba(17,20,21,.97);text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.45)}.icon{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:20px;background:rgba(55,217,138,.13);color:var(--ok);font-size:30px}h1{font-size:27px;margin:17px 0 7px;font-weight:600}p{color:var(--muted);margin:0 0 18px}.key{padding:16px 12px;border-radius:18px;background:#070909;border:1px solid rgba(17,165,202,.4);color:#fff;font:700 clamp(15px,4vw,21px)/1.2 ui-monospace,monospace;letter-spacing:.09em;word-break:break-all}.plan{margin:8px 0 18px;color:#95dfef;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.copy,.home{width:100%;height:47px;border:0;border-radius:999px;cursor:pointer;font:800 13px Montserrat;background:linear-gradient(90deg,#858585,#eee,#858585);color:#262b2d}.home{display:grid;place-items:center;margin-top:8px;text-decoration:none;background:rgba(255,255,255,.08);color:#fff}.note{font-size:10.5px;margin-top:16px}.loading{color:var(--muted)}.error{color:#ff6c78}</style></head><body><main class="card"><div class="icon">✓</div><h1>Лицензия готова</h1><p id="intro">Скопируйте ключ и вставьте его в окно активации Patternique.</p><div class="key loading" id="key">Проверяем оплату…</div><div class="plan" id="plan"></div><button class="copy" id="copy" disabled>Скопировать ключ</button><a class="home" href="/">Вернуться на сайт</a><p class="note">Ключ привязывается к одному аккаунту Figma при первой активации. Сохраните его в надёжном месте.</p></main><script>
(function(){var params=new URLSearchParams(location.search),key=params.get('key'),plan=params.get('plan'),keyEl=document.getElementById('key'),copy=document.getElementById('copy');function show(value,p){key=value;keyEl.textContent=value;keyEl.className='key';document.getElementById('plan').textContent=p==='annual'?'Лицензия на 1 год':'Бессрочная лицензия';copy.disabled=false;}function fail(){keyEl.textContent='Платёж ещё обрабатывается. Обновите страницу через несколько секунд.';keyEl.className='key error';}if(key){show(key,plan);}else{var inv=params.get('InvId')||params.get('inv_id');try{inv=inv||localStorage.getItem('patternique_inv_id');}catch(e){}var payment=null;try{payment=localStorage.getItem('patternique_payment_id');}catch(e){}var query=inv?'inv_id='+encodeURIComponent(inv):'payment='+encodeURIComponent(payment||'');if(!inv&&!payment){fail();return;}fetch('/api/get-key?'+query).then(function(r){if(!r.ok)throw new Error();return r.json();}).then(function(d){d.ok?show(d.key,d.plan):fail();}).catch(fail);}copy.addEventListener('click',function(){navigator.clipboard.writeText(key).then(function(){copy.textContent='Скопировано ✓';setTimeout(function(){copy.textContent='Скопировать ключ';},1800);});});})();
</script></body></html>
